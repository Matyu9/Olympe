[pytest]
testpaths = Test
python_files = test_*.py
markers =
    access_control: verifie la garde connexion/permission de chaque route admin, une par une
        (repetitif par nature) - exclu du run "pytest" classique, lancer avec
        `pytest -m access_control` (ou `pytest Test/AccessControl`).
addopts = -m "not access_control"
